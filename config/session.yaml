# Auto-lock / storage policy (extension + shared docs). Mirrored in
# config/session.ts, which is what the code reads.

schema_version: 1

storage:
  # The unlocked phrase lives in chrome.storage.session: memory only, cleared
  # when the browser closes, and readable by extension pages and the service
  # worker but not by content scripts (TRUSTED_CONTEXTS access level).
  decrypted_phrase_in_session_storage_only: true
  never_persist_decrypted_to_disk: true

auto_lock:
  default_ms: 600000
  min_ms: 60000
  max_ms: 3600000
  # Holds by construction: the browser empties storage.session when it closes.
  on_browser_close: true
  on_device_lock: true
  lock_now_action: true
  # An unlocked wallet page reports input at most every 30 s, and each report
  # restarts the timer, so auto-lock counts time without input.
  activity_report_ms: 30000

password:
  # 3 free attempts, then 2 s doubling per failure, capped at 5 minutes.
  # Persisted, so restarting the service worker does not reset it.
  rate_limit: exponential_backoff
  free_attempts: 3
  max_delay_ms: 300000
  # Optional per-signature password confirmation (Settings > Security).
  per_signature_confirmation: opt_in
