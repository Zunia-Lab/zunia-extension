<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zunia</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 360px;
        min-width: 360px;
        height: 600px;
        overflow: hidden;
        background: #e4e9f2;
        color: #0b1020;
        font-family: system-ui, sans-serif;
      }
      html[data-theme="dark"],
      html.zunia-dark {
        background: #05070f;
        color: #f4f5f7;
      }
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root,
      html.zunia-dark body,
      html.zunia-dark #root {
        background: #05070f;
        color: #f4f5f7;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("zunia.theme");
          var dark = true;
          if (t === "light") dark = false;
          else if (t === "system")
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = dark ? "dark" : "light";
          var el = document.documentElement;
          el.setAttribute("data-theme", r);
          el.classList.toggle("zunia-dark", dark);
          el.classList.toggle("zunia-light", !dark);
          el.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
